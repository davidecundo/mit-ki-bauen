# Runs the example guards on this repo itself: no sharp s, no forbidden words.
# There is no build here, so the placeholder check is skipped automatically.
name: Selbstprüfung

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    name: Inhalte prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content guards
        run: node examples/ci/scripts/check-content.mjs --config examples/ci/self-check.json
